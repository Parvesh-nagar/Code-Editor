<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <title>Code Editor</title>
</head>
<body>
    
<div class="code-editor-container">
    <div class="code-editor html-editor">
        <div class="head">
            <div class="left-head">
                <img src="html.png" alt="" width="30px">
                <span>HTML</span>
            </div>
            <div class="right-head">
                <i class="fa-regular fa-copy  copy copy1" ></i>
                <i class="fa-regular fa-sun  toggle_theme"></i>
                
            </div>
        </div> 
        <textarea class="html-inputArea" spellcheck="false"></textarea>
    </div>

    <div class="code-editor css-editor">
        <div class="head">
            <div class="left-head">
                <img src="css3.png" alt="" width="30px">
                <span>CSS</span>
            </div>
            <div class="right-head">
                <i class="fa-regular fa-copy copy copy2"></i>
                <i class="fa-regular fa-sun  toggle_theme"></i>
                
            </div>
        </div>

        <textarea class="css-inputArea" spellcheck="false"></textarea>
    </div>


    <div class="code-editor js-editor">
        <div class="head">
            <div class="left-head">
                <img src="js.png" alt="" width="30px">
                <span>JS</span>
            </div>
            <div class="right-head">
                <i class="fa-regular fa-copy copy copy3"></i>
                <i class="fa-regular fa-sun  toggle_theme"></i>
                
            </div>
        </div>

        <textarea class="js-inputArea" spellcheck="false"></textarea>
    </div>





</div>

<div class="output-container">
    <div class="output-head">
        <span>OUTPUT</span>
        <i class="fa-regular fa-floppy-disk" id="save-icon"></i>
        <i class="fa-solid fa-circle-chevron-up" id="fullscreen"></i>
    </div>

    <iframe id="output">
        <!-- ifeame tag k pass html tag, 1 body tag hota h -->
        
    </iframe>
</div>


<script src="script.js"></script>
</body>
</html>
